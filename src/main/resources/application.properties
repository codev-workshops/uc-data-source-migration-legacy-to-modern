spring.application.name=loan-service

# Modern Data Source Configuration
# The application reads exclusively from the modern normalized schema (schema-modern.sql:
# borrowers, loan_products, loan_accounts, payments). See DATA_SOURCE_MIGRATION_NOTES.md.
spring.datasource.url=jdbc:h2:mem:loandb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# H2 Console (for debugging)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Schema initialization. The modern schema is the runtime data source. The legacy CDW schema and
# seed data are loaded ONLY as input for migration.DataMigrationService, which populates the modern
# tables at startup; no runtime code path reads the CDW_* tables.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-modern.sql,classpath:schema-legacy.sql
spring.sql.init.data-locations=classpath:data-legacy.sql
